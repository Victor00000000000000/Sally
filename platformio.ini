; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico32]
platform = espressif32
board = pico32
framework = arduino

; Para qualquer que queira criar um teste para o código:

; * Use a flag abaixo, para indicar que um arquivo será adicionado
; use "+" ou removido "-" da build.

; * Sempre o nome do arquivo, incluindo a extensão(exemplo .cpp), 
; deve ser declarado entre "<>". 

; * A "build" é a compilação ou o código compilado.
build_source_filter =
    +<main.cpp>
    ;-<teste.cpp> - Exemplo de sintaxe para não incluir um arquivo.
    